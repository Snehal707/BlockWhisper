<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ballGradient" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(200)">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="20" result="effect1_foregroundBlur"/>
    </filter>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)" filter="url(#shadow)" />
  
  <!-- Crystal Ball -->
  <circle cx="256" cy="230" r="160" fill="url(#ballGradient)" />
  <circle cx="256" cy="230" r="155" stroke="#E9D5FF" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Highlight -->
  <ellipse cx="200" cy="180" rx="40" ry="25" fill="#FFFFFF" fill-opacity="0.2" transform="rotate(-30 200 180)" />
  
  <!-- Base Stand -->
  <path d="M196 400 L316 400 L346 440 L166 440 Z" fill="#4B5563" />
  <ellipse cx="256" cy="400" rx="60" ry="10" fill="#1F2937" />
  
  <!-- Sparkles -->
  <path d="M420 100 L430 80 L440 100 L460 110 L440 120 L430 140 L420 120 L400 110 Z" fill="#FDE047" />
  <path d="M80 150 L85 140 L90 150 L100 155 L90 160 L85 170 L80 160 L70 155 Z" fill="#FDE047" />
  <path d="M350 50 L355 40 L360 50 L370 55 L360 60 L355 70 L350 60 L340 55 Z" fill="#FDE047" opacity="0.7" />
</svg>